<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>电台排程</title>
<style>
body{font:15px system-ui;max-width:1100px;margin:24px auto;padding:0 16px;background:#f7f7f5;color:#222}
section{background:white;padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:10px}
input,select,button{padding:7px;margin:3px;border:1px solid #bbb;border-radius:6px}
button{cursor:pointer;background:#16324f;color:white}pre{white-space:pre-wrap;max-height:360px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input{width:90%}
.card{border:1px solid #d8d2c8;border-radius:8px;padding:10px 12px;margin:8px 0;background:#fcfbf9}
.card.restored{opacity:.65}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;color:white}
.tag.active{background:#a33} .tag.restored{background:#5a7d5a}
.affected{margin:6px 0 0;padding-left:0;list-style:none}
.affected li{padding:3px 0;border-top:1px dashed #e2ddd2}
.conflict{color:#a33;font-weight:600}
.restorebtn{background:#5a7d5a}
.muted{color:#777}
</style>
<h1>电台播出与版权窗口排程</h1>
<section><h2>应急停播</h2>
<div class="grid">
<input id="bregion" value="华东" placeholder="地区">
<input id="bdate" type="date" value="2026-09-28">
<input id="bstart" value="09:00" placeholder="开始 HH:MM">
<input id="bend" value="10:00" placeholder="结束 HH:MM">
<input id="breason" placeholder="停播原因，可空">
</div>
<button onclick="blackout()">登记应急停播</button>
<pre id="bresult" class="conflict"></pre>
<div id="blackouts"></div>
</section>
<section><h2>当前计划</h2><button onclick="load()">刷新</button><pre id="state"></pre></section>
<section><h2>新建节目</h2><div class="grid">
<input id="title" placeholder="节目名"><select id="kind"><option>music</option><option>ad</option><option>talk</option><option>live</option></select>
<input id="duration" type="number" value="30" placeholder="分钟"><input id="start" value="2026-01-01"><input id="end" value="2026-12-31">
<input id="region" value="华东"><input id="sponsor" placeholder="赞助商，可空"><input id="cooldown" type="number" value="0" placeholder="冷却分钟">
</div><button onclick="addProgram()">创建并授权地区</button></section>
<section><h2>排期 / 替换 / 实播对账</h2>
<div class="grid"><input id="airdate" value="2026-09-28"><input id="starttime" value="12:00"><input id="pid" type="number" placeholder="节目 ID">
<input id="sid" type="number" placeholder="排期 ID"><input id="newpid" type="number" placeholder="替换节目 ID"><input id="actualstart" value="12:00">
<input id="actualduration" type="number" value="30" placeholder="实播分钟"><input id="actualpid" type="number" placeholder="实播节目 ID，可空"></div>
<button onclick="schedule()">排期</button><button onclick="replace()">替换</button><button onclick="playout()">记录实播</button><button onclick="reconcile()">对账</button><pre id="result"></pre></section>
<script>
const out=x=>document.querySelector('#result').textContent=JSON.stringify(x,null,2);
const bout=x=>document.querySelector('#bresult').textContent=x;
async function api(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return r.json()}
async function load(){
  const state=await (await fetch('/api/state')).json();
  document.querySelector('#state').textContent=JSON.stringify(state,null,2);
  renderBlackouts(state.blackouts||[]);
}
function endTime(c){
  const [hh,mm]=c.start_time.split(':').map(Number);
  const total=hh*60+mm+c.duration_minutes;
  return String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0');
}
function renderBlackouts(list){
  document.querySelector('#blackouts').innerHTML=list.map(b=>`<div class="card ${b.status}">
    <span class="tag ${b.status}">${b.status==='active'?'生效中':'已恢复'}</span>
    <b>#${b.id}</b> ${b.region} · ${b.air_date} · ${b.start_time}–${b.end_time}
    ${b.reason?` · ${b.reason}`:''} <span class="muted">影响 ${b.cancellations.length} 条排期</span>
    ${b.status==='active'?`<button class="restorebtn" onclick="restore(${b.id})">恢复原排期</button>`:''}
    <ul class="affected">${b.cancellations.map(c=>`<li>排期 #${c.slot_id}：《${c.title}》原时段 ${c.start_time}–${endTime(c)}（原状态 ${c.previous_status}）</li>`).join('')||'<li class="muted">无受影响排期</li>'}</ul>
  </div>`).join('')||'<p class="muted">暂无停播记录</p>';
}
async function blackout(){
  bout('');
  const j=await api('/api/blackouts',{region:bregion.value,air_date:bdate.value,start_time:bstart.value,end_time:bend.value,reason:breason.value});
  if(!j.ok){bout(j.error+(j.conflicts?'\n冲突明细:\n'+j.conflicts.map(c=>`· 排期 #${c.slot_id} 实播 ${c.actual_start}–${c.actual_end}${c.title?' 《'+c.title+'》':''}`).join('\n'):''))}
  else{bout(j.reused?'相同窗口已登记，沿用原结果：#'+j.blackout.id:'已登记停播 #'+j.blackout.id+'，取消 '+j.blackout.cancellations.length+' 条排期');}
  load();
}
async function restore(id){
  const j=await api('/api/blackouts/'+id+'/restore',{});
  bout(j.ok?`已恢复停播 #${id}：${j.blackout.restored_slots.length} 条排期还原，跳过 ${j.blackout.skipped_slots.length} 条`:(j.error||'恢复失败'));
  load();
}
function addProgram(){api('/api/programs',{title:title.value,kind:kind.value,duration_minutes:+duration.value,start_date:start.value,end_date:end.value,region:region.value,regions:[region.value],sponsor:sponsor.value||null,cooldown_minutes:+cooldown.value}).then(out)}
function schedule(){api('/api/schedule',{air_date:airdate.value,start_time:starttime.value,program_id:+pid.value,region:region.value}).then(out).then(load)}
function replace(){api('/api/slots/'+sid.value+'/replace',{new_program_id:+newpid.value}).then(out).then(load)}
function playout(){api('/api/playout',{slot_id:+sid.value,actual_start:actualstart.value,actual_duration_minutes:+actualduration.value,actual_program_id:actualpid.value?+actualpid.value:null}).then(out).then(load)}
function reconcile(){api('/api/reconcile',{date:airdate.value}).then(out)}
load();
</script>
</html>
